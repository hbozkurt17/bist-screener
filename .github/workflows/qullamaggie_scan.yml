name: BIST Momentum Scanner

on:
  schedule:
    # Her hafta içi 15:30 UTC = 18:30 Türkiye saati (UTC+3)
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları kur
        run: pip install -r scanner/requirements.txt

      - name: BIST Tara & Telegram Gönder
        run: python scanner/scanner.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
