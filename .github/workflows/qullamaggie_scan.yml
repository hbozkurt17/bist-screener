name: ⚡ Qullamaggie BIST Scanner

# ────────────────────────────────────────────────────────────────────────────
# Tetikleyiciler
# ────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Her hafta içi 15:30 UTC = 18:30 Türkiye saati (UTC+3)
    # BIST kapanışı 18:00, 30 dk sonra veri Yahoo Finance'e düşmüş olur
    - cron: '30 15 * * 1-5'

  # Manuel tetikleme (test için)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tarama modu'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - bist30
          - bist100

# ────────────────────────────────────────────────────────────────────────────
# İşler
# ────────────────────────────────────────────────────────────────────────────
jobs:

  # ── BIST30 Taraması ────────────────────────────────────────────────────────
  scan-bist30:
    name: 📊 BIST30 Taraması
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'bist30' || github.event.inputs.mode == 'both' }}

    steps:
      - name: 📥 Repoyu çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları yükle
        run: pip install -r scanner/requirements.txt

      - name: 🔍 BIST30 tara
        run: python scanner/scanner.py --mode bist30

  # ── BIST100 (BIST30 hariç) Taraması ───────────────────────────────────────
  scan-bist100-ex30:
    name: 📊 BIST100 (BIST30 hariç) Taraması
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'bist100' || github.event.inputs.mode == 'both' }}

    steps:
      - name: 📥 Repoyu çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları yükle
        run: pip install -r scanner/requirements.txt

      - name: 🔍 BIST100 (ex-BIST30) tara
        run: python scanner/scanner.py --mode bist100
