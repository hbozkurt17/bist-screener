name: 📋 Haftalık Hisse Listesi Kontrolü

on:
  schedule:
    # Her Pazartesi 07:00 Türkiye saati (04:00 UTC)
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  check-stocks:
    name: 📋 BIST Hisse Listesi Kontrol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r scanner/requirements.txt
      - name: 📋 Hisse listesini kontrol et
        run: python scanner/update_stocks.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true
